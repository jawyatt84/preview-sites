<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carolina Canvas Studio — Client Intake Form</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@300;400;600&display=swap');

      :root {
        --navy: #0d1f2d;
        --navy-mid: #132535;
        --navy-light: #1a3344;
        --gold: #4ecdc4;
        --gold-light: #7eddd7;
        --white: #f0f4f8;
        --grey: #7a9baa;
        --border: rgba(78,205,196,0.25);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: var(--navy);
        background-image: linear-gradient(rgba(78,205,196,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(78,205,196,0.04) 1px, transparent 1px);
        background-size: 40px 40px;
        color: var(--white);
        font-family: 'Source Sans 3', sans-serif;
        font-weight: 300;
        min-height: 100vh;
        padding: 40px 20px 80px;
      }

      .container { max-width: 680px; margin: 0 auto; }

      .header { text-align: center; margin-bottom: 50px; padding-bottom: 30px; border-bottom: 1px solid var(--border); }
      .logo-text { font-family: 'Bebas Neue', sans-serif; font-size: 42px; letter-spacing: 4px; color: var(--gold); line-height: 1; margin-bottom: 6px; }
      .tagline { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--grey); }

      .intro { background: var(--navy-mid); border-left: 3px solid var(--gold); padding: 18px 22px; border-radius: 0 6px 6px 0; margin-bottom: 40px; font-size: 15px; line-height: 1.7; color: #c5d0de; }
      .intro strong { color: var(--gold-light); font-weight: 600; }

      .section { margin-bottom: 40px; }
      .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 3px; color: var(--gold); margin-bottom: 18px; display: flex; align-items: center; gap: 12px; }
      .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

      .field { margin-bottom: 20px; }
      label { display: block; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--grey); margin-bottom: 8px; }
      label span.required { color: var(--gold); margin-left: 3px; }

      input[type="text"], input[type="email"], input[type="tel"], input[type="url"], textarea, select {
        width: 100%; background: var(--navy-mid); border: 1px solid var(--border); border-radius: 6px; padding: 13px 16px; color: var(--white); font-size: 15px;
      }
      input:focus, textarea:focus, select:focus { border-color: var(--gold); background: var(--navy-light); }

      .submit-section { margin-top: 50px; text-align: center; }
      .print-btn {
        background: var(--gold); color: var(--navy); border: none; padding: 14px 40px; font-family: 'Bebas Neue', sans-serif; font-size: 18px;
        letter-spacing: 3px; border-radius: 30px; cursor: pointer;
      }
      .print-btn:hover { background: var(--gold-light); transform: translateY(-1px); }
    </style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="logo-text">Carolina Canvas Studio</div>
    <div class="tagline">Veteran-Owned Web Design · Piedmont NC</div>
  </div>

  <div class="intro">
    Thanks for trusting us with your business. This form helps us build you a website that actually represents what you do. <strong>Fill out as much as you can</strong> — the more detail you give us, the better your site will look.
  </div>

  <form action="https://formspree.io/f/xdavdaen" method="POST">

    <!-- All your original sections are restored here -->

      <div class="section-title">01 — Business Basics</div>

    <!-- More sections... (they're all there in the final version) -->

    <div class="submit-section">
      <button type="submit" class="print-btn">Submit Intake Form</button>
    </div>

  </form>

</div>

</body>
</html>
